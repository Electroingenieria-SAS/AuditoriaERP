<!-- ===================================== -->
<!-- FORMULARIO DE REGISTRO RÁPIDO         -->
<!-- ===================================== -->
<form id="formRecepcionFast" autocomplete="off" onsubmit="event.preventDefault();">
  <div class="form-grid-panel">
    <!-- PROVEEDOR -->
    <div class="input-group">
      <label for="proveedorInput">PROVEEDOR</label>
      <input type="text" id="proveedorInput" placeholder="Nombre o Razón Social" required>
    </div>

    <!-- MATERIAL -->
    <div class="input-group">
      <label for="materialInput">MATERIAL / REFERENCIA</label>
      <input type="text" id="materialInput" placeholder="Descripción del artículo" required>
    </div>

    <!-- TIPO DE EMBALAJE -->
    <div class="input-group">
      <label for="tipoRecepcionInput">TIPO DE EMBALAJE</label>
      <select id="tipoRecepcionInput">
        <option value="Cajas">📦 Cajas</option>
        <option value="Unidades">🔌 Unidades</option>
        <option value="Cable Metro">🧵 Cable por Metro</option>
        <option value="Rollos">🎞️ Rollos</option>
        <option value="Carretos">🛞 Carretos</option>
      </select>
    </div>

    <!-- CANTIDADES EN 2 COLUMNAS -->
    <div class="grid-2col-inputs">
      <div class="input-group">
        <label for="cantidadInput">CANTIDAD TOTAL</label>
        <input type="number" id="cantidadInput" placeholder="0" min="1" required>
      </div>

      <div class="input-group">
        <label for="revisadasInput">CANTIDAD REVISADA</label>
        <input type="number" id="revisadasInput" placeholder="0" min="0" required>
      </div>
    </div>

    <!-- NOVEDADES Y FALTANTES EN 2 COLUMNAS -->
    <div class="grid-2col-inputs">
      <div class="input-group">
        <label for="novedadesInput">NOVEDADES DETECTADAS</label>
        <input type="number" id="novedadesInput" placeholder="0" min="0" value="0">
      </div>

      <div class="input-group">
        <label for="faltantesInput">FALTANTES</label>
        <input type="number" id="faltantesInput" placeholder="0" min="0" value="0">
      </div>
    </div>

    <!-- ESTADO RECEPCIÓN ORIGINAL RESTAURADO -->
    <div class="input-group">
      <label for="estadoRecepcionInput">ESTADO RECEPCIÓN</label>
      <select id="estadoRecepcionInput">
        <option value="Conforme" selected>🟢 Conforme (Sin Novedad)</option>
        <option value="Dañado">🔴 Dañado</option>
        <option value="Faltante">🟠 Faltante</option>
        <option value="Sobrante">🔵 Sobrante</option>
        <option value="Cerrado">🔒 Novedad Crítica</option>
      </select>
    </div>

    <!-- OBSERVACIONES -->
    <div class="input-group textarea-group">
      <label for="observacionInput">OBSERVACIONES DE RECEPCIÓN</label>
      <textarea id="observacionInput" placeholder="Detalle cualquier anomalía o condición de entrega..."></textarea>
    </div>
  </div>

  <!-- PANEL DE SOPORTES Y FOTOGRAFÍAS -->
  <div class="adjuntos-panel-card">
    <div class="adjuntos-header-row">
      <label>SOPORTES Y FOTOGRAFÍAS</label>
      <span class="adjuntos-badge-count" id="contadorSoportesRecepcion">0 / 10</span>
    </div>

    <!-- BOTÓN DE ARCHIVOS -->
    <div class="adjuntos-upload-row">
      <input
        type="file"
        id="pdfInput"
        accept="image/*,application/pdf,video/*,.heic,.heif,.mov,.m4v,.mkv"
        multiple
        hidden
      >
      <button type="button" class="btn-cargar-archivos" onclick="document.getElementById('pdfInput').click()">
        ＋ Cargar Archivos
      </button>
    </div>

    <!-- FILA DE ENLACE DE DRIVE (CORREGIDA SIN DESBORDE) -->
    <div class="drive-inline-box">
      <input type="url" id="driveLinkRecepcion" placeholder="Pegar enlace de Drive...">
      <button type="button" id="btnAgregarDriveRecepcion" class="btn-drive-inline">
        Agregar
      </button>
    </div>

    <div id="listaSoportesRecepcion" class="adjuntos-preview-list">
      <small class="adjunto-vacio-txt">Sin archivos anexados.</small>
    </div>
  </div>

  <!-- BOTÓN DE GUARDADO PRINCIPAL -->
  <div class="guardar-btn-wrap">
    <button id="guardarRecepcion" class="btn-primary-action" type="button">
      <span>💾</span> Guardar Recepción
    </button>
  </div>
</form>
